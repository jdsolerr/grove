[package]
name = "grove"
version = "0.1.0"
description = "Cliente Git de escritorio"
authors = ["Grove"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Grove" # nombre visible del ejecutable y proceso en todos los SO
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grove-git = { path = "../../crates/grove-git" }
specta = "=2.0.0-rc.28"
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2"
anyhow = "1.0.104"
grove-store = { version = "0.1.0", path = "../../crates/grove-store" }
notify = "8"
notify-debouncer-mini = "0.7.0"
grove-github = { path = "../../crates/grove-github" }
grove-ai = { path = "../../crates/grove-ai" }
