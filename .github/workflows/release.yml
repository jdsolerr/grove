# Publica los instaladores en Releases al subir una etiqueta `vX.Y.Z` (o a mano desde la pestaña Actions).
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Solo lectura por defecto: `npm ci`/build ejecutan código de terceros y no deben tener token con escritura.
permissions:
  contents: read

jobs:
  check:
    name: Comprobar versión
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta debe coincidir con la versión de tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión ${v} de tauri.conf.json"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            ext: dmg
            asset: grove_macos_arm64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            ext: dmg
            asset: grove_macos_x64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            ext: exe
            asset: grove_windows_x64
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            ext: AppImage
            asset: grove_linux_x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependencias de la interfaz
        working-directory: app
        run: npm ci

      - name: Compilar
        working-directory: app
        env:
          # Variable de repo (no secreto): solo existe en el repo oficial, los forks compilan sin ella.
          GROVE_GITHUB_CLIENT_ID: ${{ vars.GROVE_GITHUB_CLIENT_ID }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Renombrar instalador
        shell: bash
        run: |
          f=$(find target/${{ matrix.target }}/release/bundle -type f -name "*.${{ matrix.ext }}" | head -n 1)
          [ -n "$f" ] || { echo "::error::No se encontró el instalador .${{ matrix.ext }}"; exit 1; }
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          cp "$f" "dist/${{ matrix.asset }}_${tag}.${{ matrix.ext }}"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
